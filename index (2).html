<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Muhammad Musa | Video Editor</title>
<meta name="description" content="Video editor for Shorts, Reels and long-form YouTube videos.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#070918; --panel:#0e1130; --line:#212659; --text:#f3f4ff; --muted:#9aa1cc;
    --accent:#6679f6; --accent2:#c7cdff;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{scroll-behavior:smooth}
  body{background:var(--bg);color:var(--text);font-family:Inter,system-ui,sans-serif;line-height:1.6}
  a{color:inherit;text-decoration:none}
  .wrap{max-width:1100px;margin:0 auto;padding:0 22px}
  h1,h2,h3{font-family:"Space Grotesk",Inter,sans-serif;line-height:1.1}
  section{padding:80px 0}
  section.alt{background:#0a0d26}
  .eyebrow{color:var(--accent);font-weight:600;font-size:13px;letter-spacing:.14em;text-transform:uppercase;margin-bottom:12px}
  h2{font-size:clamp(28px,4vw,42px);margin-bottom:12px}
  .sub{color:var(--muted);margin-bottom:34px;max-width:560px}

  /* nav */
  nav{position:sticky;top:0;z-index:20;background:rgba(7,9,24,.85);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
  nav .wrap{display:flex;align-items:center;justify-content:space-between;height:64px}
  .logo{font-family:"Space Grotesk",Inter,system-ui,sans-serif;font-weight:700;font-size:19px}
  .logo{position:relative;opacity:0;transform:translateX(-90px)}
  .logo.in{animation:logoIn 1.3s cubic-bezier(.22,.8,.3,1) forwards}
  @keyframes logoIn{from{opacity:0;transform:translateX(-90px)}to{opacity:1;transform:translateX(0)}}
  @media(prefers-reduced-motion:reduce){.logo{opacity:1;transform:none}.logo.in{animation:none}}
  .logo span{color:var(--accent2)}
  .logo::after{content:"";position:absolute;left:50%;top:100%;width:230%;height:54px;transform:translateX(-50%);background:radial-gradient(ellipse at center,rgba(215,220,255,.95) 0%,rgba(102,121,246,.6) 40%,transparent 74%);filter:blur(12px);pointer-events:none;z-index:-1}
  nav{border-bottom:1px solid transparent;border-image:linear-gradient(90deg,transparent,rgba(160,172,255,.55),transparent) 1}
  nav::after{content:"";position:absolute;left:0;right:0;top:100%;height:70px;background:radial-gradient(ellipse 55% 100% at 50% 0,rgba(102,121,246,.28),transparent 75%);pointer-events:none}
  nav ul{display:flex;gap:24px;list-style:none;font-size:14px;color:var(--muted)}
  nav ul a:hover{color:var(--text)}
  .menu-btn{display:none;background:none;border:1px solid var(--line);color:var(--text);width:42px;height:38px;border-radius:10px;font-size:20px;cursor:pointer}
  @media(max-width:760px){
    .menu-btn{display:block}
    nav ul{display:none;position:absolute;top:64px;left:0;right:0;flex-direction:column;gap:0;background:#080a1e;border-bottom:1px solid var(--line);padding:4px 22px 10px}
    nav ul.open{display:flex}
    nav ul li a{display:block;padding:14px 0;font-size:16px;color:var(--text);border-bottom:1px solid var(--line)}
    nav ul li:last-child a{border-bottom:0}
  }

  /* buttons */
  .btn{display:inline-block;padding:13px 26px;border-radius:999px;font-weight:600;font-size:15px;border:1px solid transparent;cursor:pointer;transition:.2s}
  /* scroll / load text animations */
  .rv{opacity:0}
  .rv.show{opacity:1;animation:var(--anim,rvUp) .9s cubic-bezier(.22,.8,.3,1) backwards;animation-delay:var(--d,0s)}
  .rv.left{--anim:rvLeft}.rv.right{--anim:rvRight}.rv.up{--anim:rvUp}.rv.zoom{--anim:rvZoom}
  @keyframes rvLeft{from{opacity:0;transform:translateX(-60px)}to{opacity:1;transform:none}}
  @keyframes rvRight{from{opacity:0;transform:translateX(60px)}to{opacity:1;transform:none}}
  @keyframes rvUp{from{opacity:0;transform:translateY(40px)}to{opacity:1;transform:none}}
  @keyframes rvZoom{from{opacity:0;transform:scale(.85)}to{opacity:1;transform:none}}
  #name{white-space:normal}
  #name .ch{display:inline-block;white-space:pre;opacity:0;transform:translateX(-26px)}
  #name.go .ch{animation:chIn .7s cubic-bezier(.22,.8,.3,1) forwards;animation-delay:calc(var(--i)*70ms)}
  @keyframes chIn{from{opacity:0;transform:translateX(-26px)}to{opacity:1;transform:none}}
  @media(prefers-reduced-motion:reduce){.rv{opacity:1}.rv.show{animation:none}#name .ch{opacity:1;transform:none}#name.go .ch{animation:none}}
  .btn,.menu-btn{position:relative;overflow:hidden;-webkit-tap-highlight-color:transparent}
  .btn:active,.menu-btn:active{transform:scale(.95)}
  .btn.pop{animation:btnGlow .7s ease-out}
  @keyframes btnGlow{0%{box-shadow:0 0 0 0 rgba(160,172,255,.85)}100%{box-shadow:0 0 0 20px rgba(102,121,246,0)}}
  .ripple{position:absolute;border-radius:50%;pointer-events:none;transform:scale(0);animation:rippleOut .65s ease-out forwards}
  .btn.primary .ripple,.menu-btn .ripple{background:radial-gradient(circle,rgba(255,255,255,.75),rgba(199,205,255,.35) 60%,transparent 70%)}
  .btn.ghost .ripple{background:radial-gradient(circle,rgba(102,121,246,.8),rgba(102,121,246,.35) 60%,transparent 70%)}
  @keyframes rippleOut{to{transform:scale(1);opacity:0}}
  .btn.primary{background:var(--accent);color:#fff}
  .btn.primary:hover{background:#7f90ff;transform:translateY(-2px)}
  .btn.ghost{border-color:var(--line);color:var(--text)}
  .btn.ghost:hover{border-color:var(--text)}
  .btn.ghost:active{background:var(--accent);border-color:var(--accent)}
  .btn.primary:active{background:var(--accent2);color:#0b0f33}

  /* hero */
  .hero{padding:70px 0 60px;text-align:center;background:radial-gradient(800px 380px at 50% -10%,rgba(102,121,246,.34),transparent 60%)}
  .dp{width:170px;height:170px;border-radius:50%;margin:0 auto 22px;padding:2px;background:linear-gradient(135deg,var(--accent),var(--accent2))}
  .dp .img{width:100%;height:100%;border-radius:50%;background:#151a42 center/cover no-repeat;display:grid;place-items:center;font-family:"Space Grotesk",Inter,system-ui,sans-serif;font-size:56px;font-weight:700;border:3px solid var(--bg)}
  .dp.flip{animation:dpFlip 1.1s ease-in-out}
  @keyframes dpFlip{from{transform:perspective(700px) rotateY(0deg)}to{transform:perspective(700px) rotateY(360deg)}}
  @media(prefers-reduced-motion:reduce){.dp.flip{animation:none}}
  .hero .name{font-family:"Space Grotesk",Inter,system-ui,sans-serif;font-size:clamp(32px,5.5vw,52px);font-weight:700;color:var(--text);line-height:1.1;margin-bottom:8px}
  .hero .loc{color:var(--muted);font-size:16px;margin-bottom:22px}
  .hero h1{font-size:clamp(34px,6vw,64px);max-width:820px;margin:0 auto 18px}
  .hero h1 em{font-style:normal;background:linear-gradient(90deg,var(--accent),var(--accent2));-webkit-background-clip:text;background-clip:text;color:transparent}
  .hero p{color:var(--muted);font-size:18px;max-width:580px;margin:0 auto 28px}
  .hero .cta{display:flex;gap:14px;flex-wrap:wrap;justify-content:center}
  .tools{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-top:28px}
  .tools span{border:1px solid var(--line);padding:5px 14px;border-radius:999px;font-size:13px;color:var(--muted)}
  .stats{display:flex;gap:46px;flex-wrap:wrap;justify-content:center;margin-top:44px;padding-top:28px;border-top:1px solid var(--line)}
  .stat b{font-family:"Space Grotesk",Inter,system-ui,sans-serif;font-size:32px;display:block}
  .stat span{color:var(--muted);font-size:14px}

  /* video grids */
  .grid{display:grid;gap:20px}
  .grid.shorts{grid-template-columns:repeat(auto-fill,minmax(190px,1fr))}
  .grid.long{grid-template-columns:repeat(auto-fill,minmax(310px,1fr))}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:16px;overflow:hidden;transition:.25s}
  .card:hover{transform:translateY(-5px);border-color:#4a56a8;box-shadow:0 10px 40px rgba(102,121,246,.18)}
  .thumb{position:relative;aspect-ratio:16/9;background-size:cover;background-position:center;display:grid;place-items:center}
  .shorts .thumb{aspect-ratio:9/16}
  .play{width:54px;height:54px;border-radius:50%;background:rgba(7,9,24,.6);border:1px solid rgba(255,255,255,.45);display:grid;place-items:center;transition:.2s}
  .card:hover .play{background:var(--accent);border-color:var(--accent)}
  .play::after{content:"";border-left:15px solid #fff;border-top:9px solid transparent;border-bottom:9px solid transparent;margin-left:4px}
  .card .info{padding:14px 16px 16px}
  .card h3{font-size:17px;margin-bottom:3px}
  .card p{color:var(--muted);font-size:14px}
  .shorts .card h3{font-size:15px}
  .shorts .card p{font-size:13px}

  /* inline video player */
  .thumb{cursor:pointer}
  .thumb video.poster{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;pointer-events:none}
  .thumb .play{position:relative;z-index:1}
  .thumb.active .play{display:none}
  .thumb.soon::after{content:"Coming soon";position:absolute;inset:auto 12px 12px;z-index:5;text-align:center;font-size:13px;padding:7px 10px;border-radius:10px;background:rgba(7,9,24,.85);color:#fff}
  .card:has(.thumb.active):hover{transform:none}
  .stage{position:absolute;inset:0;z-index:2;background:#000;overflow:hidden}
  .stage video,.stage iframe{position:absolute;inset:0;width:100%;height:100%;border:0;display:block;object-fit:contain;background:#000}
  .pl-shield{position:absolute;inset:0;z-index:3;cursor:pointer}
  .pl-bar{position:absolute;left:0;right:0;bottom:0;z-index:4;padding:26px 8px 8px;background:linear-gradient(transparent,rgba(5,7,25,.94));display:flex;flex-direction:column;gap:4px;cursor:default}
  .pl-seek{width:100%;height:14px;accent-color:var(--accent);cursor:pointer;margin:0}
  .pl-row{display:flex;align-items:center;justify-content:center;gap:4px}
  .pl-btn{background:rgba(255,255,255,.12);border:0;color:#fff;border-radius:8px;min-width:32px;height:32px;display:grid;place-items:center;font:600 11px Inter,sans-serif;cursor:pointer;padding:0 6px;transition:.15s}
  .pl-btn:hover,.pl-btn:active{background:var(--accent)}
  .pl-btn svg{width:16px;height:16px;fill:currentColor}
  .pl-time{display:none;font-size:11px;color:#dfe3ff;margin:0 4px;min-width:70px;text-align:center}
  .long .pl-time{display:block}
  .stage:fullscreen .pl-bar{padding-bottom:18px}
  @media(max-width:600px){.pl-btn{min-width:27px;height:28px;padding:0 4px}.pl-btn svg{width:14px;height:14px}.pl-row{gap:3px}}

  /* testimonials */
  .reviews{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:18px}
  .review{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:26px;display:flex;flex-direction:column;gap:16px}
  .stars{color:#ffc857;letter-spacing:3px;font-size:16px}
  .review q{quotes:none;font-size:16px;color:#dcdce4}
  .who{display:flex;align-items:center;gap:12px;margin-top:auto}
  .av{width:44px;height:44px;border-radius:50%;background:linear-gradient(135deg,var(--accent),#3b2fd1) center/cover;display:grid;place-items:center;font-weight:700;font-family:"Space Grotesk"}
  .who b{display:block;font-size:15px}
  .who span{color:var(--muted);font-size:13px}

  /* packages */
  .prices{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:18px}
  .price{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:28px;position:relative}
  .price.pop{border-color:var(--accent)}
  .price.pop::before{content:attr(data-badge);position:absolute;top:-12px;left:24px;background:var(--accent);font-size:12px;font-weight:600;padding:3px 12px;border-radius:999px}
  .price h3{font-size:20px}
  .price .amt{font-family:"Space Grotesk",Inter,system-ui,sans-serif;font-size:38px;margin:10px 0 14px}
  .price ul{list-style:none;color:var(--muted);font-size:15px;margin-bottom:22px}
  .price li{padding:5px 0 5px 22px;position:relative}
  .price li::before{content:"✓";position:absolute;left:0;color:var(--accent)}

  /* contact */
  .contact{text-align:center;background:radial-gradient(600px 300px at 50% 100%,rgba(102,121,246,.28),transparent 70%)}
  .contact .sub{margin:0 auto 28px}
  .contact .cta{display:flex;gap:14px;justify-content:center;flex-wrap:wrap}
  footer{border-top:1px solid var(--line);padding:26px 0;color:var(--muted);font-size:14px;text-align:center}
  /* ===== admin panel ===== */
  .rv.show.na{animation:none}
  #name.na .ch{animation:none!important;opacity:1;transform:none}
  @media(min-width:900px){body.adm-open:not(.adm-hide){margin-right:440px}}
  #adm{position:fixed;top:0;right:0;bottom:0;width:min(440px,100vw);background:#080a1e;border-left:1px solid var(--line);z-index:100;display:flex;flex-direction:column;box-shadow:-10px 0 40px rgba(0,0,0,.5);font-size:14px}
  body.adm-hide #adm{display:none}
  #admFab{display:none;position:fixed;right:16px;bottom:16px;z-index:101;background:var(--accent);color:#fff;border:0;border-radius:999px;padding:12px 20px;font:600 15px Inter,sans-serif;cursor:pointer;box-shadow:0 6px 24px rgba(102,121,246,.5)}
  body.adm-hide #admFab{display:block}
  .adm-head{padding:14px 14px 10px;border-bottom:1px solid var(--line)}
  .adm-title{display:flex;flex-direction:column;margin-bottom:10px}
  .adm-title small{color:var(--muted);font-size:12px;word-break:break-all}
  .adm-btns{display:flex;gap:6px;flex-wrap:wrap}
  .adm-btns .primary{flex:1}
  .adm-status{padding:7px 14px;font-size:12px;color:var(--muted);border-bottom:1px solid var(--line)}
  .adm-status.warn{color:#ffc857}.adm-status.ok{color:#7be0a4}
  #admBody{flex:1;overflow-y:auto;padding:10px 12px 30px}
  .adm-foot{padding:10px 12px;border-top:1px solid var(--line)}
  .asec{border:1px solid var(--line);border-radius:12px;margin-bottom:10px;background:#0b0e2a}
  .asec>summary{padding:13px 14px;font-weight:600;cursor:pointer;list-style:none}
  .asec>summary::-webkit-details-marker{display:none}
  .asec[open]>summary{border-bottom:1px solid var(--line);color:var(--accent2)}
  .asecb{padding:12px 12px 4px}
  .af{display:block;margin-bottom:12px}
  .af .al{display:block;font-size:12px;font-weight:600;color:#c9cfff;margin-bottom:5px}
  .af small{display:block;color:var(--muted);font-size:11.5px;margin:-2px 0 5px}
  .af.chk{display:flex;align-items:center;gap:8px}.af.chk .al{margin:0}
  #adm input[type=text],#adm textarea,#adm select,#admLogin input{width:100%;background:#070918;border:1px solid var(--line);color:var(--text);border-radius:8px;padding:9px 10px;font:inherit;font-size:14px}
  #adm input:focus,#adm textarea:focus,#adm select:focus,#admLogin input:focus{outline:0;border-color:var(--accent)}
  #adm textarea{resize:vertical}
  .ab{background:rgba(255,255,255,.08);border:1px solid var(--line);color:var(--text);padding:8px 12px;border-radius:8px;cursor:pointer;font:600 13px Inter,sans-serif;transition:.15s}
  .ab:hover{border-color:var(--accent2)}
  .ab.primary{background:var(--accent);border-color:var(--accent)}
  .ab.primary:hover{background:#7f90ff}
  .ab:disabled{opacity:.6;cursor:wait}
  .ab.wide{width:100%}
  .ab.add{width:100%;border-style:dashed;margin-top:4px}
  .arow{display:flex;gap:8px;align-items:center;margin-bottom:6px}
  .aprev{flex:0 0 46px;height:46px;border-radius:10px;border:1px solid var(--line);background:#070918 center/cover no-repeat}
  .ac{border:1px solid var(--line);border-radius:10px;margin-bottom:8px;background:#070918}
  .ac>summary{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:9px 10px;cursor:pointer;list-style:none}
  .ac>summary::-webkit-details-marker{display:none}
  .ac .at{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
  .actl{display:flex;gap:4px;flex-shrink:0}
  .ai{background:rgba(255,255,255,.08);border:0;color:#fff;width:28px;height:28px;border-radius:7px;cursor:pointer}
  .ai:hover{background:var(--accent)}
  .abody{padding:10px 10px 2px;border-top:1px solid var(--line)}
  #admLogin{position:fixed;inset:0;z-index:200;display:grid;place-items:center;padding:20px;background:radial-gradient(700px 400px at 50% 0,rgba(102,121,246,.35),transparent 70%),#070918;overflow:auto}
  .lbox{width:min(380px,100%);background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:28px;display:flex;flex-direction:column;gap:12px}
  .lbox h2{font-size:26px;margin:0}
  .lbox p{color:var(--muted);font-size:14px;margin:0 0 4px}
  .lforgot{background:none;border:0;color:var(--accent2);cursor:pointer;font:inherit;font-size:13px;text-decoration:underline}
  .lmsg{font-size:13px;color:#9ee7b9;min-height:18px}.lmsg.bad{color:#ff8f8f}
  .lback{position:absolute;top:18px;left:20px;color:var(--muted);font-size:14px}
  #admToast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,30px);z-index:300;background:#1a2260;border:1px solid var(--accent);color:#fff;padding:12px 18px;border-radius:12px;max-width:min(92vw,520px);font-size:14px;opacity:0;pointer-events:none;transition:.3s}
  #admToast.show{opacity:1;transform:translate(-50%,0)}
  #admToast.bad{background:#5a1420;border-color:#ff6b7f}
</style>
</head>
<body>

<nav>
  <div class="wrap">
    <a href="#top" class="logo" id="logo"></a>
    <ul id="navLinks"></ul>
    <button class="menu-btn" id="menuBtn" aria-label="Menu">&#9776;</button>
  </div>
</nav>

<!-- 1. HERO -->
<header class="hero" id="top">
  <div class="wrap">
    <div class="dp"><div class="img" id="dp"></div></div>
    <div class="name" id="name"></div>
    <div class="loc" id="loc"></div>
    <h1 id="heroTitle"></h1>
    <p id="heroText"></p>
    <div class="cta">
      <a class="btn primary" id="hb1" href="#shorts">See my work</a>
      <a class="btn ghost" id="hb2" href="#contact">Hire me</a>
    </div>
    <div class="tools" id="tools"></div>
    <div class="stats" id="stats"></div>
  </div>
</header>

<!-- 2. SHORT FORM -->
<section id="shorts">
  <div class="wrap">
    <div class="eyebrow" id="eyShorts">Short Form</div>
    <h2 id="shortsTitle"></h2>
    <p class="sub" id="shortsSub"></p>
    <div class="grid shorts" id="shortsGrid"></div>
  </div>
</section>

<!-- 3. LONG FORM -->
<section id="long" class="alt">
  <div class="wrap">
    <div class="eyebrow" id="eyLong">Long Form</div>
    <h2 id="longTitle"></h2>
    <p class="sub" id="longSub"></p>
    <div class="grid long" id="longGrid"></div>
  </div>
</section>

<!-- 4. TESTIMONIALS -->
<section id="reviews">
  <div class="wrap">
    <div class="eyebrow" id="eyReviews">Testimonials</div>
    <h2 id="reviewsTitle"></h2>
    <p class="sub" id="reviewsSub"></p>
    <div class="reviews" id="reviewsGrid"></div>
  </div>
</section>

<!-- 5. PACKAGES -->
<section id="packages" class="alt">
  <div class="wrap">
    <div class="eyebrow" id="eyPackages">Packages</div>
    <h2 id="packagesTitle"></h2>
    <p class="sub" id="packagesSub"></p>
    <div class="prices" id="prices"></div>
  </div>
</section>

<!-- 6. CONTACT -->
<section class="contact" id="contact">
  <div class="wrap">
    <div class="eyebrow" id="eyContact">Contact</div>
    <h2 id="contactTitle"></h2>
    <p class="sub" id="contactText"></p>
    <div class="cta" id="contactBtns"></div>
  </div>
</section>

<footer><div class="wrap" id="footer"></div></footer>

<script>
/* =====================================================================
   1) FIREBASE  — sirf ADMIN PANEL ke liye (apni site ke content ko online edit karne ke liye)
   Setup ke steps README me hain. Jab tak ye khali hai, admin panel "demo mode" me chalta hai
   (changes sirf isi browser me save hote hain, visitors ko nazar nahi aate).
   ===================================================================== */
const FIREBASE = {
  apiKey: "",
  authDomain: "",
  projectId: "",
  appId: "",
  adminEmails: ["yourname@gmail.com"]   // sirf ye email(s) admin panel me ja sakti hain
};
const FB_SDK = "https://www.gstatic.com/firebasejs/10.12.2/";
const DEMO_KEY = "portfolio_demo_content", CACHE_KEY = "portfolio_cache";
const fbOn = () => !!(FIREBASE.apiKey && FIREBASE.projectId);

/* =====================================================================
   2) DEFAULT CONTENT — admin panel se sab kuch badal sakte hain.
      (Ye wo content hai jo tab dikhta hai jab online save kiya hua content na ho.)
   ===================================================================== */
const CONFIG = {
  /* ---------- HERO ---------- */
  brand: "Portfolio",               // nav logo
  name: "Muhammad Musa",
  city: "Islamabad, Pakistan",
  tagline: "Video Editor based in",   // location ke saath juda hota hai

const $ = id => document.getElementById(id);
const clone = o => JSON.parse(JSON.stringify(o));
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const cssUrl = u => `url("${String(u).replace(/["\\\n\r]/g, c => encodeURIComponent(c))}")`;
const safeHref = u => { u = String(u || "").trim(); if (!u) return ""; if (/^(https?:|mailto:|tel:)/i.test(u)) return u; if (/^[\w-]+(\.[\w-]+)+/.test(u)) return "https://" + u; return ""; };
const safeTitle = s => esc(s).replace(/&lt;em&gt;/g, "<em>").replace(/&lt;\/em&gt;/g, "</em>");   // sirf <em> allowed

const gradients = [
  "linear-gradient(135deg,#6679f6,#3b2fd1)","linear-gradient(135deg,#7c8cff,#4b5bd8)",
  "linear-gradient(135deg,#8b7cff,#4a3fc9)","linear-gradient(135deg,#5a8cff,#2a43b8)",
  "linear-gradient(135deg,#a0a8ff,#5560e8)","linear-gradient(135deg,#4a5589,#0e1130)"
];
const igGradient = "linear-gradient(135deg,#f09433,#dc2743,#bc1888)";

/* link ko pehchano: youtube / instagram / drive / file */
function parseLink(raw){
  const u = String(raw || "").trim();
  if (!u) return { kind: "none" };
  let m;
  if ((m = u.match(/(?:youtu\.be\/|youtube\.com\/(?:watch\?(?:.*&)?v=|shorts\/|embed\/|live\/|v\/))([\w-]{11})/i)))
    return { kind: "youtube", id: m[1], short: /\/shorts\//i.test(u) };
  if ((m = u.match(/instagram\.com\/(?:[\w.]+\/)?(reel|reels|p|tv)\/([\w-]+)/i)))
    return { kind: "instagram", id: m[2], path: m[1] === "reels" ? "reel" : m[1], short: true };
  if ((m = u.match(/drive\.google\.com\/file\/d\/([\w-]+)/i)))
    return { kind: "drive", id: m[1] };
  if (/\.(mp4|webm|mov|m4v)(\?.*)?$/i.test(u) || !/^https?:/i.test(u))
    return { kind: "file", id: u };
  return { kind: "other", id: u };
}
function thumbFor(w, i, info){
  if (w.thumb) return cssUrl(w.thumb);
  if (info.kind === "youtube") return `url(https://img.youtube.com/vi/${info.id}/hqdefault.jpg)`;
  if (info.kind === "instagram") return igGradient;
  return gradients[i % gradients.length];
}

};
const fmt = t => { t = Math.max(0, Math.floor(t || 0)); return Math.floor(t/60) + ":" + String(t%60).padStart(2,"0"); };

/* ek waqt me sirf ek video: nayi video chalte hi purani pause (ya band) ho jati hai */
let current = null;
function claim(p){ if (current && current !== p) { try { current.pause(); } catch (_) {} } current = p; }

/* YouTube API ek baar load hoti hai */
let ytLoading;
function loadYT(){
  return ytLoading || (ytLoading = new Promise(res => {
    if (window.YT && YT.Player) return res();
    const prev = window.onYouTubeIframeAPIReady;
    window.onYouTubeIframeAPIReady = () => { if (prev) prev(); res(); };
    const sc = document.createElement("script"); sc.src = "https://www.youtube.com/iframe_api"; document.head.appendChild(sc);
  }));
}

/* --- player types (sab me same functions: play pause time dur seekTo isPlaying isMuted setMuted) --- */
function fileApi(card, stage){
  const v = card.querySelector("video.poster");
  v.classList.remove("poster"); v.removeAttribute("poster"); v.muted = false;
  stage.appendChild(v);
  const api = {
    play(){ claim(api); return v.play(); }, pause(){ v.pause(); },
    isPlaying: () => !v.paused && !v.ended, time: () => v.currentTime, dur: () => v.duration || 0,
    seekTo(t){ v.currentTime = t; }, isMuted: () => v.muted, setMuted(b){ v.muted = b; }, fsEl: v
  };
  v.addEventListener("play", () => claim(api));
  return api;
}
function ytApi(stage, id){
  const holder = document.createElement("div"); stage.appendChild(holder);
  let yt, ready = false, want = false;
  const api = {
    play(){ claim(api); want = true; if (ready) yt.playVideo(); }, pause(){ want = false; if (ready) yt.pauseVideo(); },
    isPlaying: () => ready && yt.getPlayerState() === 1, time: () => ready ? (yt.getCurrentTime() || 0) : 0,
    dur: () => ready ? (yt.getDuration() || 0) : 0, seekTo(t){ if (ready) yt.seekTo(t, true); },
    isMuted: () => ready ? yt.isMuted() : false, setMuted(b){ if (ready) b ? yt.mute() : yt.unMute(); }
  };
  loadYT().then(() => {
    const vars = { controls: 0, rel: 0, modestbranding: 1, playsinline: 1, disablekb: 1, fs: 0, iv_load_policy: 3 };
    if (/^https?:/.test(location.protocol)) vars.origin = location.origin;
    yt = new YT.Player(holder, { videoId: id, playerVars: vars, events: {
      onReady(){ ready = true; if (want) yt.playVideo(); },
      onStateChange(e){ if (e.data === 1) claim(api); }
    }});
  });
  return api;
}
/* Instagram / Drive: sirf embed. Inme custom controls aur resume possible nahi (unka apna player hai) */
function embedApi(card, stage, info){
  const f = document.createElement("iframe");
  f.src = info.kind === "instagram" ? `https://www.instagram.com/${info.path}/${info.id}/embed/` : `https://drive.google.com/file/d/${info.id}/preview`;
  f.allow = "autoplay; fullscreen; encrypted-media"; f.allowFullscreen = true; f.scrolling = "yes";
  stage.appendChild(f);
  const api = { embed: true, pause(){ unmount(card); } };
  claim(api);
  return api;
}
function unmount(card){
  const th = card.querySelector(".thumb"), st = th.querySelector(".stage");
  if (st) st.remove();
  th.classList.remove("active"); card._p = null;
}

/* custom controls: play/pause, 10 sec peeche/aage, seek bar, mute, fullscreen */
function addControls(stage, api){
  const shield = document.createElement("div"); shield.className = "pl-shield";
  const bar = document.createElement("div"); bar.className = "pl-bar";
  bar.innerHTML = `<input class="pl-seek" type="range" min="0" max="1000" value="0" aria-label="Seek">
    <div class="pl-row">
      <button class="pl-btn" data-a="back" title="10 sec peeche">&minus;10</button>
      <button class="pl-btn" data-a="play" title="Play / Pause"></button>
      <button class="pl-btn" data-a="fwd" title="10 sec aage">+10</button>
      <span class="pl-time"></span>
      <button class="pl-btn" data-a="mute" title="Mute / Unmute"></button>
      <button class="pl-btn" data-a="fs" title="Fullscreen">${ICON.fs}</button>
    </div>`;
  stage.append(shield, bar);
  const seek = bar.querySelector(".pl-seek"), pBtn = bar.querySelector('[data-a="play"]'),
        mBtn = bar.querySelector('[data-a="mute"]'), time = bar.querySelector(".pl-time");
  let dragging = false;
  const sync = () => {
    pBtn.innerHTML = api.isPlaying() ? ICON.pause : ICON.play;
    mBtn.innerHTML = api.isMuted() ? ICON.mute : ICON.vol;
    const d = api.dur();
    if (!dragging) seek.value = d ? (api.time() / d) * 1000 : 0;
    time.textContent = fmt(api.time()) + " / " + fmt(d);
  };
  const toggle = () => api.isPlaying() ? api.pause() : api.play();
  shield.onclick = () => { toggle(); setTimeout(sync, 80); };
  bar.addEventListener("click", e => {
    const b = e.target.closest("[data-a]"); if (!b) return;
    const a = b.dataset.a, d = api.dur();
    if (a === "play") toggle();
    else if (a === "back") api.seekTo(Math.max(0, api.time() - 10));
    else if (a === "fwd") api.seekTo(d ? Math.min(d - .3, api.time() + 10) : api.time() + 10);
    else if (a === "mute") api.setMuted(!api.isMuted());
    else if (a === "fs") {
      if (document.fullscreenElement || document.webkitFullscreenElement) (document.exitFullscreen || document.webkitExitFullscreen).call(document);
      else if (stage.requestFullscreen) stage.requestFullscreen();
      else if (stage.webkitRequestFullscreen) stage.webkitRequestFullscreen();
      else if (api.fsEl && api.fsEl.webkitEnterFullscreen) api.fsEl.webkitEnterFullscreen();
    }
    setTimeout(sync, 80);
  });
  seek.addEventListener("input", () => { dragging = true; const d = api.dur(); if (d) api.seekTo((seek.value / 1000) * d); });
  seek.addEventListener("change", () => { dragging = false; sync(); });
  const tick = setInterval(() => { if (!stage.isConnected) return clearInterval(tick); sync(); }, 250);
  sync();
}

function mount(card, info){
  const th = card.querySelector(".thumb");
  const stage = document.createElement("div"); stage.className = "stage";
  th.appendChild(stage); th.classList.add("active");
  let api;
  if (info.kind === "file") api = fileApi(card, stage);
  else if (info.kind === "youtube") api = ytApi(stage, info.id);
  else api = embedApi(card, stage, info);
  if (!api.embed) addControls(stage, api);
  card._p = api;
  if (api.play) api.play();
}

function drawVideos(list, gridId){
  $(gridId).innerHTML = list.map((w,i) => {
    const info = parseLink(w.url);
    const poster = info.kind === "file"
      ? `<video class="poster" src="${esc(info.id)}#t=0.1" ${w.thumb ? `poster="${esc(w.thumb)}"` : ""} preload="metadata" playsinline muted></video>` : "";
    return `
    <div class="card" data-i="${i}">
      <div class="thumb" style="background-image:${thumbFor(w,i,info)}">${poster}<div class="play"></div></div>
      <div class="info"><h3>${esc(w.title || "Video " + (i+1))}</h3>${w.desc ? `<p>${esc(w.desc)}</p>` : ""}</div>
    </div>`;
  }).join("");
  $(gridId).querySelectorAll(".card").forEach(card => {
    const info = parseLink(list[card.dataset.i].url);
    card.querySelector(".thumb").addEventListener("click", () => {
      if (card._p) return;
      const th = card.querySelector(".thumb");
      if (info.kind === "none") { th.classList.add("soon"); setTimeout(() => th.classList.remove("soon"), 1600); return; }
      if (info.kind === "other") { window.open(info.id, "_blank", "noopener"); return; }
      mount(card, info);
    });
  });
}

let C = clone(CONFIG);
const nameEl = $("name"), logoEl = $("logo"), dpBox = document.querySelector(".dp"), navLinks = $("navLinks");

function tag(sel, dir, base, step){

/* ======================== 6) content load (online / cache / default) ======================== */
async function fetchRemote(){
  const ctl = new AbortController(), t = setTimeout(() => ctl.abort(), 3500);
  try {
    const url = `https://firestore.googleapis.com/v1/projects/${encodeURIComponent(FIREBASE.projectId)}/databases/(default)/documents/site/content?key=${encodeURIComponent(FIREBASE.apiKey)}`;
    const r = await fetch(url, { signal: ctl.signal, cache: "no-store" });
    if (r.status === 404) return null;
    if (!r.ok) throw new Error("HTTP " + r.status);
    const j = await r.json();
    return JSON.parse(j.fields.data.stringValue);
  } finally { clearTimeout(t); }
}
function merge(base, remote){
  if (!remote || typeof remote !== "object") return base;
  for (const k in base)
    if (k in remote && typeof remote[k] === typeof base[k] && Array.isArray(remote[k]) === Array.isArray(base[k])) base[k] = remote[k];
  return base;
}
async function loadContent(){
  let remote = null;
  if (fbOn()) {
    try { remote = await fetchRemote(); if (remote) localStorage.setItem(CACHE_KEY, JSON.stringify(remote)); }
    catch (e) { try { remote = JSON.parse(localStorage.getItem(CACHE_KEY)); } catch (_) {} }
  } else {
    try { remote = JSON.parse(localStorage.getItem(DEMO_KEY)); } catch (_) {}
  }
  return merge(clone(CONFIG), remote);
}

function mk(tag, props, kids){
  const e = document.createElement(tag);
  for (const k in (props || {})) {
    const v = props[k];
    if (k === "class") e.className = v;
    else if (k === "html") e.innerHTML = v;
    else if (k === "value" || k === "checked" || k === "textContent" || k.startsWith("on")) e[k] = v;
    else e.setAttribute(k, v);
  }
  [].concat(kids || []).forEach(c => { if (c != null && c !== false) e.append(c); });
  return e;
}

}

/* image upload: browser me hi chhota karke (resize) save hota hai */
function resizeImage(file, max, square, cb){
  const r = new FileReader();
  r.onload = () => {
    const img = new Image();
    img.onload = () => {
      let sx = 0, sy = 0, sw = img.width, sh = img.height;
      if (square) { const m = Math.min(sw, sh); sx = (sw - m) / 2; sy = (sh - m) / 2; sw = sh = m; }
      const sc = Math.min(1, max / Math.max(sw, sh));
      const cv = document.createElement("canvas"); cv.width = Math.round(sw * sc); cv.height = Math.round(sh * sc);
      cv.getContext("2d").drawImage(img, sx, sy, sw, sh, 0, 0, cv.width, cv.height);
      cb(cv.toDataURL("image/jpeg", .85));
    };
    img.onerror = () => toast("Ye image khul nahi saki. Koi aur photo try karein.", true);
    img.src = r.result;
  };
  r.readAsDataURL(file);
}

function buildField(def, obj){
  const change = markDirty;
  if (def.t === "image") return imageField(def, obj);
  if (def.t === "list") return listField(def, obj);
  const wrap = mk("label", { class: "af" + (def.t === "check" ? " chk" : "") });
  let input;
  if (def.t === "check") {
    input = mk("input", { type: "checkbox", checked: !!obj[def.k] });
    input.onchange = () => { obj[def.k] = input.checked; change(); };
    wrap.append(input, mk("span", { class: "al", html: def.l }));
    return wrap;
  }
  wrap.append(mk("span", { class: "al", html: def.l }));
  if (def.help) wrap.append(mk("small", { html: def.help }));
  if (def.t === "textarea") {
    input = mk("textarea", { rows: "3", value: obj[def.k] == null ? "" : obj[def.k] });
    input.oninput = () => { obj[def.k] = input.value; change(); };
  } else if (def.t === "lines") {
    input = mk("textarea", { rows: "4", value: (obj[def.k] || []).join("\n") });
    input.oninput = () => { obj[def.k] = input.value.split("\n").map(s => s.trim()).filter(Boolean); change(); };
  } else if (def.t === "stars") {
    input = mk("select", {}, [1,2,3,4,5].map(n => mk("option", { value: String(n), textContent: "★".repeat(n) })));
    input.value = String(obj[def.k] || 5);
    input.onchange = () => { obj[def.k] = +input.value; change(); };
  } else {
    input = mk("input", { type: "text", value: obj[def.k] == null ? "" : obj[def.k] });
    input.oninput = () => { obj[def.k] = input.value; change(); };
  }
  wrap.append(input);
  return wrap;
}

function imageField(def, obj){
  const box = mk("div", { class: "af" });
  box.append(mk("span", { class: "al", html: def.l }));
  const prev = mk("div", { class: "aprev" });
  const url = mk("input", { type: "text", placeholder: "Image link paste karein, ya Upload dabayein" });
  const file = mk("input", { type: "file", accept: "image/*", style: "display:none" });
  const up = mk("button", { type: "button", class: "ab", textContent: "⬆ Upload" });
  const rm = mk("button", { type: "button", class: "ab", textContent: "✕ Hatao" });
  const refresh = () => {
    const v = obj[def.k] || (def.fallback ? EMBEDDED_PHOTO : "");
    prev.style.backgroundImage = v ? cssUrl(v) : "";
    const cur = obj[def.k] || "";
    url.value = cur.startsWith("data:") ? "" : cur;
    url.placeholder = cur.startsWith("data:") ? "✓ Photo upload ho gayi" : (!cur && def.fallback ? "Abhi default DP laggi hai" : "Image link paste karein, ya Upload dabayein");
  };
  up.onclick = () => file.click();
  file.onchange = () => { if (file.files[0]) resizeImage(file.files[0], def.max || 600, def.square, d => { obj[def.k] = d; refresh(); markDirty(); }); file.value = ""; };
  url.oninput = () => { obj[def.k] = url.value.trim(); prev.style.backgroundImage = obj[def.k] ? cssUrl(obj[def.k]) : ""; markDirty(); };
  rm.onclick = () => { obj[def.k] = ""; refresh(); markDirty(); };
  box.append(mk("div", { class: "arow" }, [prev, url]), mk("div", { class: "arow" }, [up, rm, file]));
  refresh();
  return box;
}

function listField(def, obj){
  const box = mk("div", { class: "af" });
  box.append(mk("span", { class: "al", html: def.l }));
  const holder = mk("div", { class: "alist" });
  const add = mk("button", { type: "button", class: "ab add", textContent: "＋ Naya add karein" });
  const arr = () => obj[def.k] || (obj[def.k] = []);
  const rebuild = () => {
    holder.innerHTML = "";
    arr().forEach((item, i) => {
      const card = mk("details", { class: "ac" });
      const label = mk("span", { class: "at", textContent: def.title(item, i) });
      const ctl = (txt, tip, fn) => mk("button", { type: "button", class: "ai", title: tip, textContent: txt, onclick: e => { e.preventDefault(); e.stopPropagation(); fn(); } });
      const move = d => () => { const a = arr(), j = i + d; if (j < 0 || j >= a.length) return; [a[i], a[j]] = [a[j], a[i]]; rebuild(); markDirty(); };
      const del = () => { if (confirm("Ye hata dein?")) { arr().splice(i, 1); rebuild(); markDirty(); } };
      card.append(mk("summary", {}, [label, mk("span", { class: "actl" }, [ctl("↑", "Upar", move(-1)), ctl("↓", "Neeche", move(1)), ctl("✕", "Hatao", del)])]));
      const body = mk("div", { class: "abody" });
      def.item.forEach(f => {
        const el = buildField(f, item);
        el.addEventListener("input", () => { label.textContent = def.title(item, i); });
        body.append(el);
      });
      card.append(body);
      holder.append(card);
    });
  };
  add.onclick = () => { arr().push(def.blank()); rebuild(); holder.lastElementChild && (holder.lastElementChild.open = true); markDirty(); };
  rebuild();
  box.append(holder, add);
  return box;
}

    } else {
      await fb.setDoc(fb.doc(fb.db, "site", "content"), { data: json, updatedAt: fb.serverTimestamp() });
      localStorage.setItem(CACHE_KEY, json);
      toast("✓ Publish ho gaya! Ab visitors ko naya content dikhega.");
    }
    dirty = false; const s = $("admStatus"); s.textContent = "✓ Saved"; s.className = "adm-status ok";
  } catch (e) {
    const m = String(e && (e.code || e.message) || e);
    toast(/permission|PERMISSION/.test(m) ? "Save nahi hua: Firestore rules me aapki email allowed nahi hai (ya login expire ho gaya)." : "Save nahi hua: " + m, true);
  }
  btn.disabled = false; btn.textContent = "💾 Save & Publish";
}

function buildPanel(email){
  document.querySelectorAll("#adm,#admFab,#admLogin").forEach(e => e.remove());
  const panel = mk("aside", { id: "adm" }, [
    mk("div", { class: "adm-head" }, [
      mk("div", { class: "adm-title" }, [mk("b", { textContent: "Admin Panel" }), mk("small", { textContent: email })]),
      mk("div", { class: "adm-btns" }, [
        mk("button", { id: "admSave", class: "ab primary", type: "button", textContent: "💾 Save & Publish", onclick: save }),
        mk("button", { class: "ab", type: "button", title: "Panel chhupayein, page dekhein", textContent: "👁", onclick: () => document.body.classList.toggle("adm-hide") }),
        mk("button", { class: "ab", type: "button", textContent: "Logout", onclick: logout })
      ])
    ]),
    mk("div", { id: "admStatus", class: "adm-status", textContent: fbOn() ? "Online mode (Firebase)" : "Demo mode: changes sirf isi browser me save honge" }),
    mk("div", { id: "admBody" }),
    mk("div", { class: "adm-foot" }, [
      mk("button", { class: "ab", type: "button", textContent: "↺ Default par wapas", onclick: () => { if (confirm("Saara content default par wapas ho jayega (Save dabane tak online nahi badlega). Karein?")) { C = clone(CONFIG); buildPanelBody(); markDirty(); } } })
    ])
  ]);
  document.body.append(panel, mk("button", { id: "admFab", type: "button", textContent: "✎ Edit", onclick: () => document.body.classList.toggle("adm-hide") }));
  document.body.classList.add("adm-open");
  buildPanelBody();
}

async function logout(){
  if (dirty && !confirm("Unsaved changes hain. Phir bhi logout karein?")) return;
  dirty = false;
  try { if (fb) await fb.signOut(fb.auth); } catch (_) {}
  location.href = location.pathname;
}

function loginScreen(){
  document.querySelectorAll("#admLogin").forEach(e => e.remove());
  const msg = mk("div", { class: "lmsg" });
  const email = mk("input", { type: "email", placeholder: "Email", autocomplete: "username" });
  const pass = mk("input", { type: "password", placeholder: "Password", autocomplete: "current-password" });
  const say = (t, bad) => { msg.textContent = t; msg.className = "lmsg" + (bad ? " bad" : ""); };
  const nice = e => { const c = String(e && e.code || e); return /invalid-credential|wrong-password|user-not-found|invalid-email/.test(c) ? "Email ya password galat hai." : /too-many/.test(c) ? "Bohat zyada koshishein. Thori der baad try karein." : /popup-closed|cancelled/.test(c) ? "Login window band ho gayi." : /unauthorized-domain/.test(c) ? "Ye website Firebase ke Authorized domains me add nahi hai." : /operation-not-allowed/.test(c) ? "Firebase me ye login method on nahi hai." : "Login nahi hua: " + c; };
  const form = mk("form", { class: "lbox" }, [
    mk("h2", { textContent: "Admin Login" }),
    mk("p", { textContent: fbOn() ? "Apni admin email se login karein." : "Firebase abhi connect nahi hai. Demo mode me panel dekh sakte hain (changes sirf isi browser me rahenge)." }),
    fbOn() && email, fbOn() && pass,
    fbOn() && mk("button", { class: "ab primary wide", type: "submit", textContent: "Login" }),
    fbOn() && mk("button", { class: "ab wide", type: "button", textContent: "Google se login", onclick: async () => { try { say("…"); await fb.signInWithPopup(fb.auth, new fb.GoogleAuthProvider()); } catch (e) { say(nice(e), true); } } }),
    fbOn() && mk("button", { class: "lforgot", type: "button", textContent: "Password bhool gaye?", onclick: async () => { if (!email.value) return say("Pehle upar email likhein.", true); try { await fb.sendPasswordResetEmail(fb.auth, email.value.trim()); say("Reset email bhej di gayi."); } catch (e) { say(nice(e), true); } } }),
    !fbOn() && mk("button", { class: "ab primary wide", type: "button", textContent: "Demo panel kholein", onclick: () => enterPanel("demo mode") }),
    msg
  ]);
  form.onsubmit = async e => { e.preventDefault(); try { say("Login ho raha hai…"); await fb.signInWithEmailAndPassword(fb.auth, email.value.trim(), pass.value); } catch (er) { say(nice(er), true); } };
  const ov = mk("div", { id: "admLogin" }, [form, mk("a", { class: "lback", href: location.pathname, textContent: "← Website par wapas" })]);
  document.body.append(ov);
  return say;
}

function enterPanel(email){ document.querySelectorAll("#admLogin").forEach(e => e.remove()); buildPanel(email); }

async function openAdmin(){
  let say = loginScreen();
  if (!fbOn()) return;
  try {
    const [app, auth, fs] = await Promise.all([import(FB_SDK + "firebase-app.js"), import(FB_SDK + "firebase-auth.js"), import(FB_SDK + "firebase-firestore.js")]);
    const a = app.initializeApp({ apiKey: FIREBASE.apiKey, authDomain: FIREBASE.authDomain, projectId: FIREBASE.projectId, appId: FIREBASE.appId });
    fb = { ...auth, ...fs, auth: auth.getAuth(a), db: fs.getFirestore(a) };
  } catch (e) { say("Firebase load nahi hua (internet check karein): " + (e.message || e), true); return; }
  fb.onAuthStateChanged(fb.auth, async user => {
    if (!user) { admUser = null; document.querySelectorAll("#adm,#admFab").forEach(e => e.remove()); document.body.classList.remove("adm-open"); if (!$("admLogin")) say = loginScreen(); return; }
    const ok = (FIREBASE.adminEmails || []).map(s => s.toLowerCase()).includes(String(user.email || "").toLowerCase());
    if (!ok) { say("Ye email (" + user.email + ") admin nahi hai.", true); try { await fb.signOut(fb.auth); } catch (_) {} return; }
    admUser = user;
    C = await loadContent();      // taaza online content se edit shuru karein
    render(false);
    enterPanel(user.email);
  });
}

/* ======================== 8) start ======================== */
(async function boot(){
  C = await loadContent();
  render(true);
  const go = () => setTimeout(() => { startReveal(); intro(); }, 300);
  document.readyState === "complete" ? go() : window.addEventListener("load", go);
  setTimeout(() => { startReveal(); intro(); }, 4000);   // safety
  if (isAdminURL()) openAdmin();
})();

</script>
</body>
</html>
