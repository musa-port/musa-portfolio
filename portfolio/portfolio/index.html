<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Muhammad Musa | Video Editor</title>
<meta name="description" content="Video editor for Shorts, Reels and long-form YouTube videos.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#070918; --panel:#0e1130; --line:#212659; --text:#f3f4ff; --muted:#9aa1cc;
    --accent:#6679f6; --accent2:#c7cdff;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{scroll-behavior:smooth}
  body{background:var(--bg);color:var(--text);font-family:Inter,system-ui,sans-serif;line-height:1.6}
  a{color:inherit;text-decoration:none}
  .wrap{max-width:1100px;margin:0 auto;padding:0 22px}
  h1,h2,h3{font-family:"Space Grotesk",Inter,sans-serif;line-height:1.1}
  section{padding:80px 0}
  section.alt{background:#0a0d26}
  .eyebrow{color:var(--accent);font-weight:600;font-size:13px;letter-spacing:.14em;text-transform:uppercase;margin-bottom:12px}
  h2{font-size:clamp(28px,4vw,42px);margin-bottom:12px}
  .sub{color:var(--muted);margin-bottom:34px;max-width:560px}

  /* nav */
  nav{position:sticky;top:0;z-index:20;background:rgba(7,9,24,.85);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
  nav .wrap{display:flex;align-items:center;justify-content:space-between;height:64px}
  .logo{font-family:"Space Grotesk",Inter,system-ui,sans-serif;font-weight:700;font-size:19px}
  .logo{position:relative;opacity:0;transform:translateX(-90px)}
  .logo.in{animation:logoIn 1.3s cubic-bezier(.22,.8,.3,1) forwards}
  @keyframes logoIn{from{opacity:0;transform:translateX(-90px)}to{opacity:1;transform:translateX(0)}}
  @media(prefers-reduced-motion:reduce){.logo{opacity:1;transform:none}.logo.in{animation:none}}
  .logo span{color:var(--accent2)}
  .logo::after{content:"";position:absolute;left:50%;top:100%;width:230%;height:54px;transform:translateX(-50%);background:radial-gradient(ellipse at center,rgba(215,220,255,.95) 0%,rgba(102,121,246,.6) 40%,transparent 74%);filter:blur(12px);pointer-events:none;z-index:-1}
  nav{border-bottom:1px solid transparent;border-image:linear-gradient(90deg,transparent,rgba(160,172,255,.55),transparent) 1}
  nav::after{content:"";position:absolute;left:0;right:0;top:100%;height:70px;background:radial-gradient(ellipse 55% 100% at 50% 0,rgba(102,121,246,.28),transparent 75%);pointer-events:none}
  nav ul{display:flex;gap:24px;list-style:none;font-size:14px;color:var(--muted)}
  nav ul a:hover{color:var(--text)}
  .menu-btn{display:none;background:none;border:1px solid var(--line);color:var(--text);width:42px;height:38px;border-radius:10px;font-size:20px;cursor:pointer}
  @media(max-width:760px){
    .menu-btn{display:block}
    nav ul{display:none;position:absolute;top:64px;left:0;right:0;flex-direction:column;gap:0;background:#080a1e;border-bottom:1px solid var(--line);padding:4px 22px 10px}
    nav ul.open{display:flex}
    nav ul li a{display:block;padding:14px 0;font-size:16px;color:var(--text);border-bottom:1px solid var(--line)}
    nav ul li:last-child a{border-bottom:0}
  }

  /* buttons */
  .btn{display:inline-block;padding:13px 26px;border-radius:999px;font-weight:600;font-size:15px;border:1px solid transparent;cursor:pointer;transition:.2s}
  /* scroll / load text animations */
  .rv{opacity:0}
  .rv.show{opacity:1;animation:var(--anim,rvUp) .9s cubic-bezier(.22,.8,.3,1) backwards;animation-delay:var(--d,0s)}
  .rv.left{--anim:rvLeft}.rv.right{--anim:rvRight}.rv.up{--anim:rvUp}.rv.zoom{--anim:rvZoom}
  @keyframes rvLeft{from{opacity:0;transform:translateX(-60px)}to{opacity:1;transform:none}}
  @keyframes rvRight{from{opacity:0;transform:translateX(60px)}to{opacity:1;transform:none}}
  @keyframes rvUp{from{opacity:0;transform:translateY(40px)}to{opacity:1;transform:none}}
  @keyframes rvZoom{from{opacity:0;transform:scale(.85)}to{opacity:1;transform:none}}
  #name{white-space:normal}
  #name .ch{display:inline-block;white-space:pre;opacity:0;transform:translateX(-26px)}
  #name.go .ch{animation:chIn .7s cubic-bezier(.22,.8,.3,1) forwards;animation-delay:calc(var(--i)*70ms)}
  @keyframes chIn{from{opacity:0;transform:translateX(-26px)}to{opacity:1;transform:none}}
  @media(prefers-reduced-motion:reduce){.rv{opacity:1}.rv.show{animation:none}#name .ch{opacity:1;transform:none}#name.go .ch{animation:none}}
  .btn,.menu-btn{position:relative;overflow:hidden;-webkit-tap-highlight-color:transparent}
  .btn:active,.menu-btn:active{transform:scale(.95)}
  .btn.pop{animation:btnGlow .7s ease-out}
  @keyframes btnGlow{0%{box-shadow:0 0 0 0 rgba(160,172,255,.85)}100%{box-shadow:0 0 0 20px rgba(102,121,246,0)}}
  .ripple{position:absolute;border-radius:50%;pointer-events:none;transform:scale(0);animation:rippleOut .65s ease-out forwards}
  .btn.primary .ripple,.menu-btn .ripple{background:radial-gradient(circle,rgba(255,255,255,.75),rgba(199,205,255,.35) 60%,transparent 70%)}
  .btn.ghost .ripple{background:radial-gradient(circle,rgba(102,121,246,.8),rgba(102,121,246,.35) 60%,transparent 70%)}
  @keyframes rippleOut{to{transform:scale(1);opacity:0}}
  .btn.primary{background:var(--accent);color:#fff}
  .btn.primary:hover{background:#7f90ff;transform:translateY(-2px)}
  .btn.ghost{border-color:var(--line);color:var(--text)}
  .btn.ghost:hover{border-color:var(--text)}
  .btn.ghost:active{background:var(--accent);border-color:var(--accent)}
  .btn.primary:active{background:var(--accent2);color:#0b0f33}

  /* hero */
  .hero{padding:70px 0 60px;text-align:center;background:radial-gradient(800px 380px at 50% -10%,rgba(102,121,246,.34),transparent 60%)}
  .dp{width:170px;height:170px;border-radius:50%;margin:0 auto 22px;padding:2px;background:linear-gradient(135deg,var(--accent),var(--accent2))}
  .dp .img{width:100%;height:100%;border-radius:50%;background:#151a42 center/cover no-repeat;display:grid;place-items:center;font-family:"Space Grotesk",Inter,system-ui,sans-serif;font-size:56px;font-weight:700;border:3px solid var(--bg)}
  .dp.flip{animation:dpFlip 1.1s ease-in-out}
  @keyframes dpFlip{from{transform:perspective(700px) rotateY(0deg)}to{transform:perspective(700px) rotateY(360deg)}}
  @media(prefers-reduced-motion:reduce){.dp.flip{animation:none}}
  .hero .name{font-family:"Space Grotesk",Inter,system-ui,sans-serif;font-size:clamp(32px,5.5vw,52px);font-weight:700;color:var(--text);line-height:1.1;margin-bottom:8px}
  .hero .loc{color:var(--muted);font-size:16px;margin-bottom:22px}
  .hero h1{font-size:clamp(34px,6vw,64px);max-width:820px;margin:0 auto 18px}
  .hero h1 em{font-style:normal;background:linear-gradient(90deg,var(--accent),var(--accent2));-webkit-background-clip:text;background-clip:text;color:transparent}
  .hero p{color:var(--muted);font-size:18px;max-width:580px;margin:0 auto 28px}
  .hero .cta{display:flex;gap:14px;flex-wrap:wrap;justify-content:center}
  .tools{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-top:28px}
  .tools span{border:1px solid var(--line);padding:5px 14px;border-radius:999px;font-size:13px;color:var(--muted)}
  .stats{display:flex;gap:46px;flex-wrap:wrap;justify-content:center;margin-top:44px;padding-top:28px;border-top:1px solid var(--line)}
  .stat b{font-family:"Space Grotesk",Inter,system-ui,sans-serif;font-size:32px;display:block}
  .stat span{color:var(--muted);font-size:14px}

  /* video grids */
  .grid{display:grid;gap:20px}
  .grid.shorts{grid-template-columns:repeat(auto-fill,minmax(190px,1fr))}
  .grid.long{grid-template-columns:repeat(auto-fill,minmax(310px,1fr))}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:16px;overflow:hidden;transition:.25s}
  .card:hover{transform:translateY(-5px);border-color:#4a56a8;box-shadow:0 10px 40px rgba(102,121,246,.18)}
  .thumb{position:relative;aspect-ratio:16/9;background-size:cover;background-position:center;display:grid;place-items:center}
  .shorts .thumb{aspect-ratio:9/16}
  .play{width:54px;height:54px;border-radius:50%;background:rgba(7,9,24,.6);border:1px solid rgba(255,255,255,.45);display:grid;place-items:center;transition:.2s}
  .card:hover .play{background:var(--accent);border-color:var(--accent)}
  .play::after{content:"";border-left:15px solid #fff;border-top:9px solid transparent;border-bottom:9px solid transparent;margin-left:4px}
  .card .info{padding:14px 16px 16px}
  .card h3{font-size:17px;margin-bottom:3px}
  .card p{color:var(--muted);font-size:14px}
  .shorts .card h3{font-size:15px}
  .shorts .card p{font-size:13px}

  /* inline video player */
  .thumb{cursor:pointer}
  .thumb video.poster{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;pointer-events:none}
  .thumb .play{position:relative;z-index:1}
  .thumb.active .play{display:none}
  .thumb.soon::after{content:"Coming soon";position:absolute;inset:auto 12px 12px;z-index:5;text-align:center;font-size:13px;padding:7px 10px;border-radius:10px;background:rgba(7,9,24,.85);color:#fff}
  .card:has(.thumb.active):hover{transform:none}
  .stage{position:absolute;inset:0;z-index:2;background:#000;overflow:hidden}
  .stage video,.stage iframe{position:absolute;inset:0;width:100%;height:100%;border:0;display:block;object-fit:contain;background:#000}
  .pl-shield{position:absolute;inset:0;z-index:3;cursor:pointer}
  .pl-bar{position:absolute;left:0;right:0;bottom:0;z-index:4;padding:26px 8px 8px;background:linear-gradient(transparent,rgba(5,7,25,.94));display:flex;flex-direction:column;gap:4px;cursor:default}
  .pl-seek{width:100%;height:14px;accent-color:var(--accent);cursor:pointer;margin:0}
  .pl-row{display:flex;align-items:center;justify-content:center;gap:4px}
  .pl-btn{background:rgba(255,255,255,.12);border:0;color:#fff;border-radius:8px;min-width:32px;height:32px;display:grid;place-items:center;font:600 11px Inter,sans-serif;cursor:pointer;padding:0 6px;transition:.15s}
  .pl-btn:hover,.pl-btn:active{background:var(--accent)}
  .pl-btn svg{width:16px;height:16px;fill:currentColor}
  .pl-time{display:none;font-size:11px;color:#dfe3ff;margin:0 4px;min-width:70px;text-align:center}
  .long .pl-time{display:block}
  .stage:fullscreen .pl-bar{padding-bottom:18px}
  @media(max-width:600px){.pl-btn{min-width:27px;height:28px;padding:0 4px}.pl-btn svg{width:14px;height:14px}.pl-row{gap:3px}}

  /* testimonials */
  .reviews{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:18px}
  .review{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:26px;display:flex;flex-direction:column;gap:16px}
  .stars{color:#ffc857;letter-spacing:3px;font-size:16px}
  .review q{quotes:none;font-size:16px;color:#dcdce4}
  .who{display:flex;align-items:center;gap:12px;margin-top:auto}
  .av{width:44px;height:44px;border-radius:50%;background:linear-gradient(135deg,var(--accent),#3b2fd1) center/cover;display:grid;place-items:center;font-weight:700;font-family:"Space Grotesk"}
  .who b{display:block;font-size:15px}
  .who span{color:var(--muted);font-size:13px}

  /* packages */
  .prices{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:18px}
  .price{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:28px;position:relative}
  .price.pop{border-color:var(--accent)}
  .price.pop::before{content:"Most popular";position:absolute;top:-12px;left:24px;background:var(--accent);font-size:12px;font-weight:600;padding:3px 12px;border-radius:999px}
  .price h3{font-size:20px}
  .price .amt{font-family:"Space Grotesk",Inter,system-ui,sans-serif;font-size:38px;margin:10px 0 14px}
  .price ul{list-style:none;color:var(--muted);font-size:15px;margin-bottom:22px}
  .price li{padding:5px 0 5px 22px;position:relative}
  .price li::before{content:"✓";position:absolute;left:0;color:var(--accent)}

  /* contact */
  .contact{text-align:center;background:radial-gradient(600px 300px at 50% 100%,rgba(102,121,246,.28),transparent 70%)}
  .contact .sub{margin:0 auto 28px}
  .contact .cta{display:flex;gap:14px;justify-content:center;flex-wrap:wrap}
  footer{border-top:1px solid var(--line);padding:26px 0;color:var(--muted);font-size:14px;text-align:center}
</style>
</head>
<body>

<nav>
  <div class="wrap">
    <a href="#top" class="logo" id="logo"></a>
    <ul id="navLinks">
      <li><a href="#top">Home</a></li>

      <li><a href="#reviews">Testimonials</a></li>

<!-- 1. HERO -->

</header>

<!-- 2. SHORT FORM -->
<section id="shorts">
  <div class="wrap">
    <div class="eyebrow">Short Form</div>

    <p class="sub" id="shortsSub"></p>
    <div class="grid shorts" id="shortsGrid"></div>
  </div>
</section>

<!-- 3. LONG FORM -->
<section id="long" class="alt">
  <div class="wrap">
    <div class="eyebrow">Long Form</div>
    <h2 id="longTitle"></h2>
    <p class="sub" id="longSub"></p>
    <div class="grid long" id="longGrid"></div>
  </div>
</section>

<!-- 4. TESTIMONIALS -->
<section id="reviews">
  <div class="wrap">
    <div class="eyebrow">Testimonials</div>
    <h2 id="reviewsTitle"></h2>
    <p class="sub" id="reviewsSub"></p>
    <div class="reviews" id="reviewsGrid"></div>
  </div>
</section>

<!-- 5. PACKAGES -->
<section id="packages" class="alt">
  <div class="wrap">
    <div class="eyebrow">Packages</div>
    <h2 id="packagesTitle"></h2>
    <p class="sub" id="packagesSub"></p>
    <div class="prices" id="prices"></div>
  </div>
</section>

<!-- 6. CONTACT -->
<section class="contact" id="contact">
  <div class="wrap">
    <div class="eyebrow">Contact</div>
    <h2 id="contactTitle"></h2>
    <p class="sub" id="contactText"></p>
    <div class="cta" id="contactBtns"></div>
  </div>
</section>

<footer><div class="wrap" id="footer"></div></footer>

<script>
/* =====================================================================
   ✏️  EDIT EVERYTHING HERE  — sirf is CONFIG ke andar ka text badlein.
   Neeche ka code (render part) ko chherne ki zaroorat nahi.
   ===================================================================== */
const CONFIG = {
  /* ---------- HERO ---------- */

  name: "Muhammad Musa",

  tagline: "Video Editor based in",   // location ke saath juda hota hai

const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

/* hero */

$("name").textContent = C.name;

$("heroTitle").innerHTML = C.heroTitle;
$("heroText").textContent = C.heroText;
$("tools").innerHTML = C.tools.map(t => `<span>${esc(t)}</span>`).join("");
$("stats").innerHTML = C.stats.map(s => `<div class="stat"><b>${esc(s.value)}</b><span>${esc(s.label)}</span></div>`).join("");
const dp = $("dp");
if (C.photo || EMBEDDED_PHOTO) dp.style.backgroundImage = `url("${C.photo || EMBEDDED_PHOTO}")`;

/* videos */
const gradients = [
  "linear-gradient(135deg,#6679f6,#3b2fd1)","linear-gradient(135deg,#7c8cff,#4b5bd8)",
  "linear-gradient(135deg,#8b7cff,#4a3fc9)","linear-gradient(135deg,#5a8cff,#2a43b8)",
  "linear-gradient(135deg,#a0a8ff,#5560e8)","linear-gradient(135deg,#4a5589,#0e1130)"
];
const igGradient = "linear-gradient(135deg,#f09433,#dc2743,#bc1888)";

/* link ko pehchano: youtube / instagram / drive / file */
function parseLink(raw){
  const u = String(raw || "").trim();
  if (!u) return { kind: "none" };
  let m;
  if ((m = u.match(/(?:youtu\.be\/|youtube\.com\/(?:watch\?(?:.*&)?v=|shorts\/|embed\/|live\/|v\/))([\w-]{11})/i)))
    return { kind: "youtube", id: m[1], short: /\/shorts\//i.test(u) };
  if ((m = u.match(/instagram\.com\/(?:[\w.]+\/)?(reel|reels|p|tv)\/([\w-]+)/i)))
    return { kind: "instagram", id: m[2], path: m[1] === "reels" ? "reel" : m[1], short: true };
  if ((m = u.match(/drive\.google\.com\/file\/d\/([\w-]+)/i)))
    return { kind: "drive", id: m[1] };
  if (/\.(mp4|webm|mov|m4v)(\?.*)?$/i.test(u) || !/^https?:/i.test(u))
    return { kind: "file", id: u };
  return { kind: "other", id: u };
}
function thumbFor(w, i, info){
  if (w.thumb) return `url("${w.thumb}")`;
  if (info.kind === "youtube") return `url(https://img.youtube.com/vi/${info.id}/hqdefault.jpg)`;
  if (info.kind === "instagram") return igGradient;
  return gradients[i % gradients.length];
}

  play:  '<svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>',
  pause: '<svg viewBox="0 0 24 24"><path d="M6 5h4v14H6zM14 5h4v14h-4z"/></svg>',
  vol:   '<svg viewBox="0 0 24 24"><path d="M3 9v6h4l5 4V5L7 9H3zm13.5 3a4.5 4.5 0 0 0-2.5-4v8a4.5 4.5 0 0 0 2.5-4z"/></svg>',
  mute:  '<svg viewBox="0 0 24 24"><path d="M3 9v6h4l5 4V5L7 9H3zm13.6 3 2.4-2.4-1.4-1.4-2.4 2.4-2.4-2.4-1.4 1.4 2.4 2.4-2.4 2.4 1.4 1.4 2.4-2.4 2.4 2.4 1.4-1.4z"/></svg>',
  fs:    '<svg viewBox="0 0 24 24"><path d="M5 5h5v2H7v3H5V5zm9 0h5v5h-2V7h-3V5zM5 14h2v3h3v2H5v-5zm12 0h2v5h-5v-2h3v-3z"/></svg>'
};
const fmt = t => { t = Math.max(0, Math.floor(t || 0)); return Math.floor(t/60) + ":" + String(t%60).padStart(2,"0"); };

/* ek waqt me sirf ek video: nayi video chalte hi purani pause (ya band) ho jati hai */
let current = null;
function claim(p){ if (current && current !== p) current.pause(); current = p; }

/* YouTube API ek baar load hoti hai */
let ytLoading;
function loadYT(){
  return ytLoading || (ytLoading = new Promise(res => {
    if (window.YT && YT.Player) return res();
    const prev = window.onYouTubeIframeAPIReady;
    window.onYouTubeIframeAPIReady = () => { if (prev) prev(); res(); };
    const sc = document.createElement("script"); sc.src = "https://www.youtube.com/iframe_api"; document.head.appendChild(sc);
  }));
}

/* --- player types (sab me same functions: play pause time dur seekTo isPlaying isMuted setMuted) --- */
function fileApi(card, stage){
  const v = card.querySelector("video.poster");
  v.classList.remove("poster"); v.removeAttribute("poster"); v.muted = false;
  stage.appendChild(v);
  const api = {
    play(){ claim(api); return v.play(); }, pause(){ v.pause(); },
    isPlaying: () => !v.paused && !v.ended, time: () => v.currentTime, dur: () => v.duration || 0,
    seekTo(t){ v.currentTime = t; }, isMuted: () => v.muted, setMuted(b){ v.muted = b; }, fsEl: v
  };
  v.addEventListener("play", () => claim(api));
  return api;
}
function ytApi(stage, id){
  const holder = document.createElement("div"); stage.appendChild(holder);
  let yt, ready = false, want = false;
  const api = {
    play(){ claim(api); want = true; if (ready) yt.playVideo(); }, pause(){ want = false; if (ready) yt.pauseVideo(); },
    isPlaying: () => ready && yt.getPlayerState() === 1, time: () => ready ? (yt.getCurrentTime() || 0) : 0,
    dur: () => ready ? (yt.getDuration() || 0) : 0, seekTo(t){ if (ready) yt.seekTo(t, true); },
    isMuted: () => ready ? yt.isMuted() : false, setMuted(b){ if (ready) b ? yt.mute() : yt.unMute(); }
  };
  loadYT().then(() => {
    const vars = { controls: 0, rel: 0, modestbranding: 1, playsinline: 1, disablekb: 1, fs: 0, iv_load_policy: 3 };
    if (/^https?:/.test(location.protocol)) vars.origin = location.origin;
    yt = new YT.Player(holder, { videoId: id, playerVars: vars, events: {
      onReady(){ ready = true; if (want) yt.playVideo(); },
      onStateChange(e){ if (e.data === 1) claim(api); }
    }});
  });
  return api;
}
/* Instagram / Drive: sirf embed. Inme custom controls aur resume possible nahi (unka apna player hai) */
function embedApi(card, stage, info){
  const f = document.createElement("iframe");
  f.src = info.kind === "instagram" ? `https://www.instagram.com/${info.path}/${info.id}/embed/` : `https://drive.google.com/file/d/${info.id}/preview`;
  f.allow = "autoplay; fullscreen; encrypted-media"; f.allowFullscreen = true; f.scrolling = "yes";
  stage.appendChild(f);
  const api = { embed: true, pause(){ unmount(card); } };
  claim(api);
  return api;
}
function unmount(card){
  const th = card.querySelector(".thumb"), st = th.querySelector(".stage");
  if (st) st.remove();
  th.classList.remove("active"); card._p = null;
}

/* custom controls: play/pause, 10 sec peeche/aage, seek bar, mute, fullscreen */
function addControls(stage, api){
  const shield = document.createElement("div"); shield.className = "pl-shield";
  const bar = document.createElement("div"); bar.className = "pl-bar";
  bar.innerHTML = `<input class="pl-seek" type="range" min="0" max="1000" value="0" aria-label="Seek">
    <div class="pl-row">
      <button class="pl-btn" data-a="back" title="10 sec peeche">&minus;10</button>
      <button class="pl-btn" data-a="play" title="Play / Pause"></button>
      <button class="pl-btn" data-a="fwd" title="10 sec aage">+10</button>
      <span class="pl-time"></span>
      <button class="pl-btn" data-a="mute" title="Mute / Unmute"></button>
      <button class="pl-btn" data-a="fs" title="Fullscreen">${ICON.fs}</button>
    </div>`;
  stage.append(shield, bar);
  const seek = bar.querySelector(".pl-seek"), pBtn = bar.querySelector('[data-a="play"]'),
        mBtn = bar.querySelector('[data-a="mute"]'), time = bar.querySelector(".pl-time");
  let dragging = false;
  const sync = () => {
    pBtn.innerHTML = api.isPlaying() ? ICON.pause : ICON.play;
    mBtn.innerHTML = api.isMuted() ? ICON.mute : ICON.vol;
    const d = api.dur();
    if (!dragging) seek.value = d ? (api.time() / d) * 1000 : 0;
    time.textContent = fmt(api.time()) + " / " + fmt(d);
  };
  const toggle = () => api.isPlaying() ? api.pause() : api.play();
  shield.onclick = () => { toggle(); setTimeout(sync, 80); };
  bar.addEventListener("click", e => {
    const b = e.target.closest("[data-a]"); if (!b) return;
    const a = b.dataset.a, d = api.dur();
    if (a === "play") toggle();
    else if (a === "back") api.seekTo(Math.max(0, api.time() - 10));
    else if (a === "fwd") api.seekTo(d ? Math.min(d - .3, api.time() + 10) : api.time() + 10);
    else if (a === "mute") api.setMuted(!api.isMuted());
    else if (a === "fs") {
      if (document.fullscreenElement || document.webkitFullscreenElement) (document.exitFullscreen || document.webkitExitFullscreen).call(document);
      else if (stage.requestFullscreen) stage.requestFullscreen();
      else if (stage.webkitRequestFullscreen) stage.webkitRequestFullscreen();
      else if (api.fsEl && api.fsEl.webkitEnterFullscreen) api.fsEl.webkitEnterFullscreen();
    }
    setTimeout(sync, 80);
  });
  seek.addEventListener("input", () => { dragging = true; const d = api.dur(); if (d) api.seekTo((seek.value / 1000) * d); });
  seek.addEventListener("change", () => { dragging = false; sync(); });
  setInterval(sync, 250);
  sync();
}

function mount(card, info){
  const th = card.querySelector(".thumb");
  const stage = document.createElement("div"); stage.className = "stage";
  th.appendChild(stage); th.classList.add("active");
  let api;
  if (info.kind === "file") api = fileApi(card, stage);
  else if (info.kind === "youtube") api = ytApi(stage, info.id);
  else api = embedApi(card, stage, info);
  if (!api.embed) addControls(stage, api);
  card._p = api;
  if (api.play) api.play();
}

function drawVideos(list, gridId){
  $(gridId).innerHTML = list.map((w,i) => {
    const info = parseLink(w.url);
    const poster = info.kind === "file"
      ? `<video class="poster" src="${esc(info.id)}#t=0.1" ${w.thumb ? `poster="${esc(w.thumb)}"` : ""} preload="metadata" playsinline muted></video>` : "";
    return `
    <div class="card" data-i="${i}">
      <div class="thumb" style="background-image:${thumbFor(w,i,info)}">${poster}<div class="play"></div></div>
      <div class="info"><h3>${esc(w.title || "Video " + (i+1))}</h3>${w.desc ? `<p>${esc(w.desc)}</p>` : ""}</div>
    </div>`;
  }).join("");
  $(gridId).querySelectorAll(".card").forEach(card => {
    const info = parseLink(list[card.dataset.i].url);
    card.querySelector(".thumb").addEventListener("click", () => {
      if (card._p) return;
      const th = card.querySelector(".thumb");
      if (info.kind === "none") { th.classList.add("soon"); setTimeout(() => th.classList.remove("soon"), 1600); return; }
      if (info.kind === "other") { window.open(info.id, "_blank", "noopener"); return; }
      mount(card, info);
    });
  });
}
$("shortsTitle").textContent = C.shortsTitle; $("shortsSub").textContent = C.shortsSub;

/* text animations: naam letter-by-letter + baaki text slide/fade (hero load par, sections scroll par) */

nameEl.setAttribute("aria-label", C.name);

function tag(sel, dir, base, step){
  document.querySelectorAll(sel).forEach((el,i) => {
    el.classList.add("rv", dir);
    el.style.setProperty("--d", (base + i*step) + "s");
  });
}
/* hero: ek ke baad ek */
tag(".hero .loc", "left", 1.0, 0);
tag(".hero h1", "left", 1.15, 0);
tag(".hero p", "left", 1.35, 0);
tag(".hero .cta .btn", "up", 1.55, .12);
tag(".hero .tools span", "zoom", 1.8, .08);
tag(".hero .stat", "up", 2.1, .12);
/* sections: scroll karte hi */

tag("section h2", "left", .1, 0);
tag("section .sub", "left", .2, 0);
document.querySelectorAll(".grid, .reviews, .prices").forEach(g => {
  [...g.children].forEach((el,i) => { el.classList.add("rv", g.classList.contains("reviews") ? (i%2 ? "right":"left") : "up"); el.style.setProperty("--d", (.15 + (i%4)*.12) + "s"); });
});
tag(".contact .cta .btn", "zoom", .3, .12);
tag("footer .wrap", "up", 0, 0);

function startReveal(){
  if (startReveal.done) return; startReveal.done = true;
  nameEl.classList.add("go");
  const io = new IntersectionObserver(es => es.forEach(e => { if (e.isIntersecting){ e.target.classList.add("show"); io.unobserve(e.target); } }), { threshold: .15 });
  document.querySelectorAll(".rv").forEach(el => io.observe(el));
}
window.addEventListener("load", () => setTimeout(startReveal, 300));
setTimeout(startReveal, 4000);   // safety

/* button click animation (ripple + glow) */
document.addEventListener("click", e => {
  const b = e.target.closest(".btn, .menu-btn");
  if (!b) return;
  const r = b.getBoundingClientRect(), size = Math.max(r.width, r.height) * 2.2;
  const rp = document.createElement("span");
  rp.className = "ripple";
  rp.style.cssText = `width:${size}px;height:${size}px;left:${e.clientX - r.left - size/2}px;top:${e.clientY - r.top - size/2}px`;
  b.appendChild(rp);
  setTimeout(() => rp.remove(), 700);
  b.classList.remove("pop"); void b.offsetWidth; b.classList.add("pop");
});

/* DP flip: page load hone ke baad 2 baar (3 sec gap), phir har 10 sec baad */
const dpBox = document.querySelector(".dp");
function flipDP(){ dpBox.classList.remove("flip"); void dpBox.offsetWidth; dpBox.classList.add("flip"); }
const logoEl = document.getElementById("logo");
window.addEventListener("load", () => {
  setTimeout(() => logoEl.classList.add("in"), 250);   // "Portfolio." slide-left + fade-in
  setTimeout(flipDP, 600);                                   // 1st flip
  setTimeout(() => { flipDP(); setInterval(flipDP, 10000); }, 3600);  // 2nd flip (3 sec baad), phir har 10 sec
});

navLinks.querySelectorAll("a").forEach(a => a.onclick = () => { navLinks.classList.remove("open"); $("menuBtn").innerHTML = "&#9776;"; });
